; ESP32-2432S028 "Cheap Yellow Display" - GitHub Copilot AI credit meter
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ESP32-2432S028R

[cyd]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
extra_scripts = post:post_build_merge.py
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
	time
	colorize
upload_speed = 921600
board_build.partitions = huge_app.csv
; TFT_eSPI setup: display on HSPI, leaving VSPI free for the SD card
build_flags =
	-DUSER_SETUP_LOADED=1
	-DDISABLE_ALL_LIBRARY_WARNINGS=1
	-DILI9341_2_DRIVER=1
	-DUSE_HSPI_PORT=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=6000000
	-DSPI_TOUCH_FREQUENCY=2500000
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	mathertel/OneButton@^2.6.1
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@^7.2.0

; Original CYD with a single micro-USB port
[env:ESP32-2432S028R]
extends = cyd
build_flags =
	${cyd.build_flags}
	-DESP32_2432S028R=1

; Revised CYD with micro-USB + USB-C, needs display inversion
[env:ESP32-2432S028-2USB]
extends = cyd
build_flags =
	${cyd.build_flags}
	-DESP32_2432S028_2USB=1
	-DTFT_INVERSION_ON
